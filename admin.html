<!doctype html>

<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--red:#D71920;--red2:#a80f15;--ink:#111;--bg:#f3f3f3;--mut:#555}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;padding-bottom:env(safe-area-inset-bottom)}
header{background:#111;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:6px solid var(--red);position:relative}
header img{height:52px}
header h1{font-size:21px;margin:0;font-weight:900;line-height:1.15;padding-right:88px}
.lang{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;border:2px solid #fff;border-radius:999px;overflow:hidden;background:#000}
.lang button{background:transparent;color:#fff;border:0;font-weight:800;font-size:13px;padding:5px 10px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--red)}
main{max-width:1000px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.08);padding:16px;margin-bottom:12px}
h2{font-size:21px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:12px;padding:14px 18px;font-size:19px;font-weight:800;cursor:pointer;background:#e6e6e6;color:var(--ink)}
button.red{background:var(--red);color:#fff}button.green{background:#12B76A;color:#fff}button.dark{background:#111;color:#fff}
button:disabled{opacity:.4;cursor:default}
.state{font-size:24px;font-weight:900}.open{color:#039855}.closed{color:var(--red)}
.big{font-size:64px;font-weight:900;line-height:1}
.stats{display:flex;gap:12px}.stats>div{flex:1;background:#111;color:#fff;border-radius:14px;text-align:center;padding:12px}
.stats span{font-size:16px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pl{border:3px solid #e2e2e2;border-radius:14px;background:#fff;padding:0 0 6px;text-align:center;overflow:hidden;position:relative;font-size:14px;font-weight:800;cursor:pointer}
.pl img{width:100%;aspect-ratio:1/1;display:block;background:#111;object-fit:cover}
.pl .c{position:absolute;top:5px;right:5px;background:var(--red);color:#fff;border-radius:10px;padding:1px 8px;font-size:15px}
.pl .nr{position:absolute;top:5px;left:5px;background:#111;color:#fff;border-radius:8px;padding:1px 6px;font-size:13px}
.pl.sel{border-color:#FDB022;box-shadow:0 0 0 3px #FDB022}
input{font-size:22px;padding:12px;border:2px solid #bbb;border-radius:10px;width:120px;text-align:center;font-weight:800}
input.w{width:100%;text-align:left;font-weight:400}
.win{background:var(--red);color:#fff;border-radius:16px;padding:16px;margin-top:12px}
.win h3{margin:0 0 8px;font-size:22px}
.win .p{font-size:26px;font-weight:900;line-height:1.25}.win .p small{font-size:20px;font-weight:700;opacity:.9}
.muted{color:var(--mut);font-size:16px}
table{width:100%;border-collapse:collapse;font-size:16px}td,th{text-align:left;padding:6px;border-bottom:1px solid #eee}
.hide{display:none!important}
#err{color:var(--red);font-weight:800;margin:6px 12px}
.prize{background:#111;color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;border-left:6px solid var(--red);font-weight:700;font-size:16px;line-height:1.35}
</style>
</head>
<body>
<header>
  <img src="assets/logo-wga.png" alt="">
  <h1>VIP Kanspel Admin<br><span style="font-weight:600;font-size:16px" data-i18n="sub"></span></h1>
  <div class="lang" role="group" aria-label="Taal / Language">
    <button type="button" id="lang-nl" data-set-lang="nl">NL</button>
    <button type="button" id="lang-en" data-set-lang="en">EN</button>
  </div>
</header>
<p id="err"></p>
<main>
<section id="login" class="card hide">
  <p data-i18n="loginTxt"></p>
  <input id="key" class="w" type="password" autocomplete="off" data-i18n-placeholder="codePh" inputmode="numeric"><br><br>
  <button class="red" id="keyBtn" data-i18n="loginBtn"></button>
</section>
<div id="app" class="hide">
  <p class="prize" data-i18n="prize"></p>
  <section class="card">
    <div class="row" style="justify-content:space-between"><div data-i18n="votingLbl"></div>
      <div class="row"><button id="closeBtn" class="red" data-i18n="closeBtn"></button><button id="openBtn" class="green" data-i18n="openBtn"></button></div></div>
    <div class="stats" style="margin-top:12px"><div><div class="big" id="nt">0</div><span data-i18n="statEntries"></span></div><div><div class="big" id="avg">–</div><span data-i18n="statAvg"></span></div></div>
    <p class="muted" style="margin:8px 0 0"><span data-i18n="live"></span> <span id="upd"></span></p>
  </section>
  <section class="card">
    <h2 data-i18n="hQ1"></h2>
    <p class="muted" style="margin-top:0" data-i18n="q1Hint"></p>
    <div id="grid" class="grid"></div>
    <div class="row" style="margin-top:10px"><button id="clrScorer" data-i18n="clrQ1"></button></div>
    <div id="w1" class="win hide"></div>
  </section>
  <section class="card">
    <h2 data-i18n="hQ2"></h2>
    <div class="row"><input id="q1" type="text" inputmode="numeric" maxlength="2" placeholder="?"><button id="saveQ1" class="dark" data-i18n="saveQ2"></button><button id="clrQ1" data-i18n="clear"></button></div>
    <div id="w2" class="win hide"></div>
  </section>
  <section class="card">
    <details><summary><b data-i18n="allEntries"></b></summary><table><thead><tr><th data-i18n="thTime"></th><th data-i18n="thName"></th><th data-i18n="thGsm"></th><th data-i18n="thThree"></th><th>Q1</th></tr></thead><tbody id="list"></tbody></table></details>
    <br><div class="row"><button id="csvBtn" data-i18n="csvBtn"></button><button id="wipeBtn" data-i18n="wipeBtn"></button></div>
  </section>
</div>
</main>
<script src="vip.js?v=3"></script>
<script>
(function(){
var API_KEY="AIzaSyAoVJMKiuVDSqqyMW4vE6dbbcZ5SW5IUSE", ADMINS=["7RtLUCunESf9F8Kwj4Fs3XvVKXg2","0m5l7HFk67WrnLM0CvItYVTBRrm2"];
var EMU=/[?&]emu=1/.test(location.search), P=VipGok.P, LS="vipgok1711_admin_k", LANG_KEY="vipkanspel_lang";
var DB=EMU?"http://127.0.0.1:9000":"https://giants-veiling-default-rtdb.europe-west1.firebasedatabase.app", NS=EMU?"ns=giants-veiling-default-rtdb&":"";
var $=function(i){return document.getElementById(i)}, tok=null, tokExp=0, data={};

  nl:{

    open:"OPEN", closed:"CLOSED",

  }
};
var lang="nl";
function t(k){ var L=I18N[lang]||I18N.nl; return (L[k]!=null?L[k]:I18N.nl[k])||k }
function applyLang(){
  document.documentElement.lang=lang;
  document.title=lang==="en"?"VIP Kanspel Admin":"VIP Kanspel Admin";
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"),function(el){el.innerHTML=t(el.getAttribute("data-i18n"))});
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-placeholder]"),function(el){el.setAttribute("placeholder",t(el.getAttribute("data-i18n-placeholder")))});
  $("lang-nl").classList.toggle("on",lang==="nl");
  $("lang-en").classList.toggle("on",lang==="en");
  if(!$("app").classList.contains("hide"))render();
}
try{lang=localStorage.getItem(LANG_KEY)||"nl"}catch(e){}
if(lang!=="en")lang="nl";
$("lang-nl").onclick=function(){lang="nl";try{localStorage.setItem(LANG_KEY,lang)}catch(e){}applyLang()};
$("lang-en").onclick=function(){lang="en";try{localStorage.setItem(LANG_KEY,lang)}catch(e){}applyLang()};
function b64(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
function unlock(code){var S=crypto.subtle;return S.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]).then(function(k){return S.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])}).then(function(k){return S.decrypt({name:"AES-GCM",iv:b64(ENC.i)},k,b64(ENC.c))}).then(function(b){return new TextDecoder().decode(b)})}
var m=location.hash.match(/k=([^&]+)/);
if(m){try{localStorage.setItem(LS,decodeURIComponent(m[1]))}catch(e){}history.replaceState(null,"",location.pathname+location.search)}
function key(){try{return localStorage.getItem(LS)}catch(e){return null}}
function idToken(){
  if(tok&&Date.now()<tokExp)return Promise.resolve(tok);
  if(EMU){var b=function(o){return btoa(JSON.stringify(o)).replace(/=+$/,"").replace(/\+/g,"-").replace(/\//g,"_")},n=Math.floor(Date.now()/1000);
    tok=b({alg:"none",typ:"JWT"})+"."+b({sub:ADMINS[1],user_id:ADMINS[1],aud:"giants-veiling",iss:"https://securetoken.google.com/giants-veiling",iat:n,exp:n+3600,auth_time:n,firebase:{sign_in_provider:"anonymous"}})+".";tokExp=Date.now()+3e6;return Promise.resolve(tok)}
  var k=key();if(!k)return Promise.reject(new Error("nokey"));
  return fetch("https://securetoken.googleapis.com/v1/token?key="+API_KEY,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(k)})
   .then(function(r){return r.json().then(function(d){if(!r.ok||ADMINS.indexOf(d.user_id)<0)throw new Error("badkey");tok=d.id_token;tokExp=Date.now()+(+d.expires_in-120)*1000;return tok})});
}
function rest(method,path,body){return idToken().then(function(t){return fetch(DB+"/"+path+".json?"+NS+"auth="+encodeURIComponent(t),{method:method,body:body===undefined?undefined:JSON.stringify(body)})})
  .then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(method+" "+path+": "+r.status+" "+t.slice(0,100));return JSON.parse(t)})})}
function votes(){return Object.keys(data.votes||{}).map(function(u){var v=data.votes[u],d=VipGok.decode(v.n);return d?{uid:u,name:d.name,nr:d.nr,score:d.score,p:v.p,t:v.t}:null}).filter(Boolean).sort(function(a,b){return a.t-b.t})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tm(t){return new Date(t).toLocaleTimeString(lang==="en"?"en-GB":"nl-BE",{timeZone:"Europe/Brussels",hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function pn(nr){var p=VipGok.player(nr);return p?("#"+p.nr+" "+p.name):nr}
function people(l){return l.map(function(v){return '<div class="p">'+esc(v.name)+' <small>· '+esc(VipGok.fmtPhone(v.p))+(v.score!=null?' · '+t("guess")+' '+v.score:'')+'</small></div>'}).join("")}
$("grid").innerHTML=VipGok.PLAYERS.map(function(p){return '<div class="pl" data-nr="'+p.nr+'"><span class="nr">#'+p.nr+'</span><span class="c" id="c'+p.nr+'">0</span><img src="assets/spelers/'+p.img+'.webp" alt=""><div>'+esc(p.name)+'</div></div>'}).join("");
function render(){
  var vs=votes(),cfg=data.config||{},open=cfg.open!==false;
  $("nt").textContent=vs.length;$("avg").textContent=vs.length?(vs.reduce(function(a,v){return a+v.score},0)/vs.length).toFixed(1).replace(lang==="en"?".":"x", lang==="en"?".":","): "–";
  // keep comma for NL: toFixed gives dot; for NL replace
  if(vs.length && lang==="nl")$("avg").textContent=(vs.reduce(function(a,v){return a+v.score},0)/vs.length).toFixed(1).replace(".",",");
  $("upd").textContent=tm(Date.now());
  if($("st")){$("st").textContent=open?t("open"):t("closed");$("st").className="state "+(open?"open":"closed")}
  $("closeBtn").disabled=!open;$("openBtn").disabled=open;
  VipGok.PLAYERS.forEach(function(p){$("c"+p.nr).textContent=vs.filter(function(v){return v.nr===p.nr}).length;
    document.querySelector('.pl[data-nr="'+p.nr+'"]').classList.toggle("sel",String(cfg.scorer)===p.nr)});
  if(document.activeElement!==$("q1"))$("q1").value=cfg.q1!=null?cfg.q1:"";
  var w=VipGok.winners(vs,cfg.scorer,cfg.q1);
  if(cfg.scorer!=null){$("w1").classList.remove("hide");$("w1").innerHTML="<h3>"+t("winQ1").replace("{player}",esc(pn(cfg.scorer))).replace("{n}",w.q1.length).replace("{word}",w.q1.length===1?t("word1"):t("wordN"))+"</h3>"+(w.q1.length?people(w.q1):'<div class="p"><small>'+t("nobody")+'</small></div>')}else $("w1").classList.add("hide");
  if(cfg.q1!=null){var plural=w.q2.length>1?(lang==="en"?"ies":"en"):(lang==="en"?"y":"");var ex=w.diff===0?t("exact"):w.diff!=null?t("diff").replace("{n}",w.diff):"";
    $("w2").classList.remove("hide");$("w2").innerHTML="<h3>"+t("winQ2").replace("{score}",cfg.q1).replace("{plural}",plural).replace("{exact}",ex)+"</h3>"+(w.q2.length?people(w.q2):'<div class="p"><small>'+t("noEntries")+'</small></div>')}else $("w2").classList.add("hide");
  $("list").innerHTML=vs.map(function(v){return "<tr><td>"+tm(v.t)+"</td><td>"+esc(v.name)+"</td><td>"+esc(VipGok.fmtPhone(v.p))+"</td><td>"+esc(pn(v.nr))+"</td><td>"+v.score+"</td></tr>"}).join("");
}
function refresh(){return rest("GET",P).then(function(d){data=d||{};$("err").textContent="";render()},function(e){$("err").textContent=t("loadErr").replace("{msg}",e.message)})}
function act(p){return p.then(refresh,function(e){alert(t("actErr").replace("{msg}",e.message))})}
$("closeBtn").onclick=function(){act(rest("PATCH",P+"/config",{open:false}))};
$("openBtn").onclick=function(){act(rest("PATCH",P+"/config",{open:true}))};
Array.prototype.forEach.call(document.querySelectorAll(".pl"),function(el){el.onclick=function(){var nr=el.getAttribute("data-nr");
  if(confirm(t("confirmQ1").replace("{player}",pn(nr))))act(rest("PATCH",P+"/config",{scorer:nr}))}});
$("clrScorer").onclick=function(){act(rest("DELETE",P+"/config/scorer"))};
$("saveQ1").onclick=function(){var v=VipGok.validScore($("q1").value);if(v===null)return alert(t("needScore"));$("q1").blur();act(rest("PATCH",P+"/config",{q1:v}))};
$("clrQ1").onclick=function(){$("q1").value="";act(rest("DELETE",P+"/config/q1"))};
$("csvBtn").onclick=function(){var rows=[[t("csvTime"),t("csvName"),t("csvGsm"),t("csvThree"),t("csvQ1")]].concat(votes().map(function(v){return [new Date(v.t).toLocaleString("nl-BE",{timeZone:"Europe/Brussels"}),v.name,VipGok.fmtPhone(v.p),pn(v.nr),v.score]}));
  var csv="\ufeff"+rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(";")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="vip-kanspel-17-11.csv";a.click()};
$("wipeBtn").onclick=function(){if(prompt(t("wipePrompt"))===t("wipeWord"))act(rest("PUT",P,{config:{open:true}}))};
function tryKey(){var v=$("key").value.trim();$("err").textContent="";
  unlock(v).then(function(k){try{localStorage.setItem(LS,k)}catch(e){}tok=null;start()},function(){$("err").textContent=t("badCode");$("key").value="";$("key").focus()})}
$("keyBtn").onclick=tryKey;$("key").onkeydown=function(e){if(e.key==="Enter")tryKey()};
function start(){idToken().then(function(){$("login").classList.add("hide");$("app").classList.remove("hide");applyLang();refresh();if(!window._iv)window._iv=setInterval(refresh,2500)},
  function(e){try{localStorage.removeItem(LS)}catch(x){}tok=null;$("login").classList.remove("hide");$("err").textContent=e.message==="nokey"?"":t("retype");$("key").value="";$("key").focus()})}
applyLang();
(function(){var k=key();if(k&&k.length<40){try{localStorage.removeItem(LS)}catch(x){}unlock(k).then(function(r){try{localStorage.setItem(LS,r)}catch(e){}start()},function(){start()})}else start()})();
})();
</script>
